<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kachimbosafio 2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#0d0a0c;--stone:#2a2321;--hi:#4a3d38;--lo:#120d0d;--gold:#ffd27a;--ember:#f08a3c;--text:#f4e6d0;--muted:#a89886;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Pixelify Sans","Courier New",monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;
background-image:radial-gradient(ellipse 60% 45% at 50% 32%,rgba(240,138,60,.28),transparent 70%),repeating-conic-gradient(#120e10 0 25%,#0d0a0c 0 50%);background-size:auto,32px 32px}
main{width:100%;max-width:760px;padding:32px 20px;text-align:center}
.logo{display:block;width:min(100%,560px);margin:0 auto 28px;filter:drop-shadow(0 0 28px rgba(255,170,70,.35))}
h1{font-size:clamp(18px,3.4vw,24px);font-weight:500;color:var(--muted);margin:0 0 20px;letter-spacing:.04em}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2vw,16px);margin:0 auto 32px}
.slot{background:var(--stone);border:4px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);padding:clamp(12px,3vw,20px) 4px}
.num{display:block;font-size:clamp(34px,9vw,64px);font-weight:700;color:var(--gold);line-height:1;text-shadow:0 3px 0 #6b3f12}
.lbl{display:block;margin-top:10px;font-size:clamp(12px,2.6vw,16px);color:var(--muted)}
.btn{display:inline-block;font:inherit;font-size:20px;font-weight:700;color:#1a0f08;background:linear-gradient(#ffd98c,#f0963c);text-decoration:none;padding:14px 30px;border:4px solid;border-color:#fff0c4 #8a4a12 #8a4a12 #fff0c4;box-shadow:0 5px 0 #4a2606}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4a2606}
.btn:focus-visible{outline:3px solid #fff;outline-offset:4px}
.go{display:none;font-size:clamp(26px,7vw,44px);color:var(--gold);margin:0 0 32px;text-shadow:0 3px 0 #6b3f12}
.live .clock,.live h1{display:none}.live .go{display:block}
</style></head><body>
